<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" fill="none">
  <defs>
    <linearGradient id="vtlGrad" x1="40" y1="40" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <style>
      .word { font-family: "Plus Jakarta Sans", "Inter", Arial, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
      .sub { font-family: "Inter", Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="1600" height="400" fill="white"/>
  <!-- colder, more minimal symbol -->
  <circle cx="180" cy="200" r="118" stroke="url(#vtlGrad)" stroke-width="10"/>
  <!-- slight opening in circle -->
  <path d="M287 126 A118 118 0 0 1 298 156" stroke="white" stroke-width="18" stroke-linecap="round"/>
  <!-- V-check -->
  <path d="M130 198 L176 246 L242 146" stroke="#0F172A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="215" class="word" font-size="118" fill="#0F172A">Vetuonglai</text>
  <text x="364" y="275" class="sub" font-size="28" fill="#0F172A" opacity="0.74">Về Tương Lai</text>
</svg>