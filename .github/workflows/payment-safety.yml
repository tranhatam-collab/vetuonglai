name: Payment hold guard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-payment-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/payment-hold.test.mjs
      - run: git diff --check
