name: Deploy Vetuonglai Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: f3f9e76222dcb488d5e303e29e8ba192
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler@4.75.0

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Sync Cloudflare Projects
        run: npm run cloudflare:sync

      - name: Deploy Pages
        run: npm run cloudflare:deploy

      - name: Deploy Workers
        run: npm run cloudflare:deploy:workers

      - name: Verify Runtime Domains
        run: npm run cloudflare:verify:runtime

      - name: Smoke Endpoints
        run: npm run cloudflare:smoke:endpoints
