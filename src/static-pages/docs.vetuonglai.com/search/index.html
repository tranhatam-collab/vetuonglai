<!doctype html>
<html lang="vi" data-language="vi" data-domain="docs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-text-vi="Tìm trong tài liệu — Vetuonglai Docs" data-text-en="Search docs — Vetuonglai Docs">Tìm trong tài liệu — Vetuonglai Docs</title>
<meta name="description" data-content-vi="Tìm trong tài liệu API, governance, changelog." data-content-en="Search API docs, governance, changelog." content="Tìm trong tài liệu API, governance, changelog." />
<meta name="robots" content="noindex,follow" />
<link rel="icon" type="image/svg+xml" href="/assets/web/web-favicon-docs.svg" />
<meta name="theme-color" content="#475569" />
<link rel="canonical" href="https://docs.vetuonglai.com/search/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap&subset=latin,latin-ext,vietnamese" />
<link rel="stylesheet" href="/assets/design-tokens.css" />
<link rel="stylesheet" href="/_pagefind/pagefind-ui.css" />
<style>
body{margin:0;font-family:var(--vt-font-sans);background:var(--vt-bg-main);color:var(--vt-text-main)}
.shell{max-width:820px;margin:0 auto;padding:48px 20px 96px}
h1{font-family:var(--vt-font-display);font-size:clamp(1.8rem,3.5vw,2.6rem);margin:0 0 12px;letter-spacing:-0.02em}
.lead{color:var(--vt-text-soft);margin:0 0 32px}
.pagefind-ui{--pagefind-ui-primary:#475569;--pagefind-ui-text:#0F172A;--pagefind-ui-background:#FFFFFF;--pagefind-ui-border:#E2E8F0;--pagefind-ui-tag:#F1F5F9;--pagefind-ui-border-radius:10px;--pagefind-ui-font:var(--vt-font-sans)}
.brand{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;margin-bottom:32px}
</style>
</head>
<body>
<div class="shell">
  <a class="brand" href="https://docs.vetuonglai.com">
    <img src="/assets/brand/vetuonglai-monogram.svg" alt="" width="32" height="32" />
    <strong>Vetuonglai Docs</strong>
  </a>
  <h1>Tìm trong tài liệu</h1>
  <p class="lead" data-text-vi="API reference, governance, changelog — tất cả ở đây." data-text-en="API reference, governance, changelog — all here.">API reference, governance, changelog — tất cả ở đây.</p>
  <div data-vtl-search></div>
</div>
<script type="module">
  import { PagefindUI } from "/_pagefind/pagefind-ui.js";
  new PagefindUI({
    element: "[data-vtl-search]",
    showImages: false,
    showSubResults: true,
    debounceTimeoutMs: 200,
    resetStyles: false,
    translations: {
      placeholder: "Tìm trong tài liệu…",
      clear_search: "Xoá",
      load_more: "Tải thêm",
      zero_results: "Không có kết quả cho \"[SEARCH_TERM]\"",
      many_results: "[COUNT] kết quả",
      one_result: "1 kết quả",
      searching: "Đang tìm…"
    }
  });
</script>
</body>
</html>
